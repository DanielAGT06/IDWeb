<link rel="stylesheet" href="css/style.css">
<section id="contacto" class="contenedor-sobre-mi">
  
  <h2>Contacto</h2>

  <div class="contenido-flex">
    <div class="texto-columna">
      
      <p>
        ¿Tienes alguna consulta o propuesta de proyecto? Puedes enviarme un mensaje directamente completando el siguiente formulario:
      </p>

      <!-- Formulario visual (no procesa datos) -->
      <form action="#" method="post" class="formulario-contacto">
        
        <div class="campo">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
        </div>

        <div class="campo">
          <label for="asunto">Asunto:</label>
          <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu mensaje...">
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit" class="btn-volver">Enviar mensaje</button>

      </form>

      <p>
        <a href="index.html" class="btn-volver">← Volver al Inicio</a>
      </p>

    </div>
  </div>

</section>
